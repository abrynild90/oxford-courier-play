const menu=document.getElementById('station');
for(const s of stations){const option=document.createElement('option');option.value=s.key;option.textContent=s.title;menu.append(option)}
function selectPair(){
 const s=stations[menu.selectedIndex],light=document.querySelector('[name=light]:checked').value;
 for(const [id,dir] of [['old','before'],['new','after']]){const url=dir+'/'+s.key+'-'+light+'.jpg';document.getElementById(id+'Link').href=url;const img=document.getElementById(id);img.src=url;img.alt=s.title+' in '+light+', '+dir+' the overnight changes'}

}
function advance(step){const night=document.querySelector('[value=dusk]').checked;const n=(2*menu.selectedIndex+Number(night)+step+stations.length*2)%(stations.length*2);menu.selectedIndex=Math.floor(n/2);document.querySelector(n%2?'[value=dusk]':'[value=day]').checked=true;selectPair()}
